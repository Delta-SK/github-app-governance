name: codeql

# Static analysis of the workflows themselves. This repository's riskiest code
# is not Terraform: it is the CI that hands an organisation-admin token to
# jobs — above all terraform-plan.yml, a pull_request_target workflow. CodeQL's
# `actions` language finds exactly that class of mistake: untrusted checkouts
# in privileged workflows, expression injection into `run:`, over-broad token
# permissions. Results land in the Security tab and on the pull request.
#
# Runs on every pull request with the pull request's own workflow files, and
# needs no credential beyond uploading its results.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "15 7 * * 1" # Mondays, with the other weekly checks

# Nothing at workflow level: each job requests exactly what it needs.
permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (actions)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload results to code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions
