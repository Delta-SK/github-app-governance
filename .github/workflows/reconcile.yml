name: reconcile

# Detection cannot depend on somebody happening to open a pull request.
# This runs the same governance checks on a schedule and raises an issue when
# the organisation stops matching the catalogue — or when the controls that
# protect this repository have been weakened by hand.
#
# One issue, labelled `reconciliation`, is kept open while anything is wrong
# and commented on each week; it closes itself once everything is clean.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

# Nothing at workflow level: each job requests exactly what it needs.
permissions: {}

env:
  AWS_REGION: eu-central-1

jobs:
  reconcile:
    name: reconcile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      issues: write

    # Runs from main, so it is trusted code — but it only ever reads. It takes
    # the production environment for the GitHub token and the read-only plan
    # role for state, so a bug here cannot damage state.
    environment: production

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(tr -d '[:space:]' < ../.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC, read-only state)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -no-color

      - name: terraform plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          set +e
          terraform plan -no-color -input=false -lock=false -detailed-exitcode -out=tfplan 2>&1 | tee reconcile.txt
          CODE=${PIPESTATUS[0]}
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"

          # A failing check block is only a WARNING: with no resource changes
          # terraform still exits 0. Orphan detection lives in a check block,
          # so the exit code alone would never report an undeclared app — the
          # single most important thing this job exists to find.
          #
          # Read the check results out of the plan instead.
          FAILED=0
          : > failed_checks.txt
          if [ -f tfplan ]; then
            FAILED=$(terraform show -json tfplan \
              | jq '[.checks[]? | select(.status == "fail")] | length')
            terraform show -json tfplan \
              | jq -r '.checks[]? | select(.status == "fail") | .address.to_display' \
              > failed_checks.txt
          fi
          echo "failed_checks=$FAILED" >> "$GITHUB_OUTPUT"
          echo "plan exit=$CODE, failed checks=$FAILED"

      # bootstrap/ owns this repository's branch protection, environments and
      # CODEOWNERS team, and is applied by hand with its own state so CI cannot
      # rewrite them. The price is that no plan ever looks at them. This does.
      - name: Verify this repository's own controls
        id: controls
        env:
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          bash ../scripts/verify-repo-controls.sh "$REPO" | tee controls.txt
          echo "failed=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Raise or update reconciliation issue
        if: >-
          steps.plan.outputs.exitcode != '0' || steps.plan.outputs.failed_checks != '0' ||
          steps.controls.outputs.failed != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          CONTROLS_FAILED: ${{ steps.controls.outputs.failed }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '';
            let out = read('terraform/reconcile.txt');
            if (out.length > 50000) out = out.slice(0, 50000) + '\n...truncated.';

            const code = process.env.EXITCODE;
            const failedChecks = read('terraform/failed_checks.txt').trim().split('\n').filter(Boolean);
            const controls = read('terraform/controls.txt').trim();

            // Every finding is listed, not just the first: an orphan and an
            // expired app in the same week are two different owners' problems.
            // Governance checks are warnings, so they do NOT move the exit
            // code — they are the only way an orphaned installation surfaces.
            const findings = [];
            if (code === '1') findings.push('**The plan failed.** Most often an app past its `review_by` date (a blocking condition) — the error names the app and its owner.');
            if (code === '2') findings.push('**Drift:** GitHub no longer matches the catalogue — access was changed outside a pull request. Either codify the change in a pull request, or run `terraform-apply` manually to restore the catalogue\'s access.');
            if (failedChecks.length) findings.push(`**Governance checks failed:** ${failedChecks.map(c => '`' + c + '`').join(', ')}. The messages in the plan output say what to do.`);
            if (process.env.CONTROLS_FAILED !== '0') findings.push('**This repository\'s own controls were weakened:**\n\n' + controls + '\n\nRestore them by re-applying `bootstrap/`.');

            const title = 'Reconciliation: organisation does not match the catalogue';
            const body = [
              ...findings.map(f => '- ' + f),
              '',
              `Detected by the \`reconcile\` workflow (plan exit code ${code}). What to do for each finding: docs/OPERATIONS.md, "Triage a reconciliation issue".`,
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```terraform',
              out,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'reconciliation',
            });

            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['reconciliation'],
              });
            }

      - name: Close the reconciliation issue when clean
        if: >-
          steps.plan.outputs.exitcode == '0' && steps.plan.outputs.failed_checks == '0' &&
          steps.controls.outputs.failed == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'reconciliation',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Reconciled — the organisation now matches the catalogue. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail the run when reconciliation found something
        if: >-
          steps.plan.outputs.exitcode != '0' || steps.plan.outputs.failed_checks != '0' ||
          steps.controls.outputs.failed != '0'
        run: exit 1
