name: scorecard

# OpenSSF Scorecard: an independent, automated review of this repository's
# supply-chain hygiene — pinned dependencies, token permissions, dangerous
# workflow patterns, dependency updates — published as the README badge and
# uploaded to code scanning (Security tab).
#
# Scorecard's API accepts results only from a tightly constrained workflow: no
# workflow-level env, defaults or write permissions, no `run:` steps, and only
# an approved list of actions. Keep this file bare.
#
# It runs with the default GITHUB_TOKEN only. Scorecard cannot read classic
# branch protection without an admin token, and the organisation-admin PAT is
# never handed to a third-party action — so the Branch-Protection check
# under-reports by design (README, "Limitations").

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1" # Mondays, after reconcile
  branch_protection_rule:

# read-all rather than {} as in the other workflows: this mirrors Scorecard's
# published template, which its API validates against. It grants no writes,
# and the job below overrides it with exactly two permissions.
permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results for the badge

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
