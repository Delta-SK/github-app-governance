name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/terraform-*.yml"
  # Manual trigger for re-running a failed apply without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never cancel a running apply: an interrupted apply can leave state locked
# or partially written. Queue instead.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: eu-central-1

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest

    # Runs code already merged to main, so it is trusted. The environment
    # pins the credential to protected branches rather than gating on a
    # reviewer — the pull request that merged the change was the gate.
    environment: production

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC, read-write state)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      # The plan is recomputed here from trusted code rather than reusing the
      # one posted on the pull request. That is deliberate: the PR plan was
      # produced by a job running untrusted pull request code, and applying
      # an artifact it produced would hand that code a path to the apply
      # credential. The PR plan is a preview; this is the plan of record.
      #
      # Saving it and applying the saved file means the log below shows
      # exactly what was applied — nothing is re-planned between the two.
      - name: terraform plan (plan of record)
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform plan -no-color -input=false -out=tfplan

      # The enforcing copy of the guard. Runs from main, so a pull request
      # cannot have edited it.
      - name: plan guard
        run: bash ../scripts/plan-guard.sh tfplan

      - name: terraform apply
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform apply -no-color -input=false tfplan

      - name: Show resulting access matrix
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform output -json app_access_matrix
