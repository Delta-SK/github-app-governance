name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"
  # Manual trigger for re-running a failed apply without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never cancel a running apply: an interrupted apply can leave state locked
# or partially written. Queue instead.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: eu-central-1

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform apply -auto-approve -input=false

      - name: Show resulting access matrix
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform output -json app_access_matrix
