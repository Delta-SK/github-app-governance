name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".terraform-version"
      - ".github/workflows/terraform-apply.yml"
  # Manual trigger for re-running a failed apply without an empty commit.
  workflow_dispatch:

# Nothing at workflow level: each job requests exactly what it needs.
permissions: {}

# Never cancel a running apply: an interrupted apply can leave state locked
# or partially written. Queue instead.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

jobs:
  apply:
    name: apply
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    # Runs code already merged to main, so it is trusted. The environment
    # admits main only rather than gating on a reviewer — the pull request
    # that merged the change was the gate.
    environment: production

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(tr -d '[:space:]' < ../.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC, read-write state)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -no-color

      # The plan is recomputed here rather than reusing one from the pull
      # request. Both pull request plans are previews: the automatic one ran
      # against main as it was when the PR was last pushed, and the code plan
      # ran the pull request's own code — an artifact from that job must
      # never reach the apply credential. This is the plan of record.
      #
      # Saving it and applying the saved file means the log below shows
      # exactly what was applied — nothing is re-planned between the two.
      - name: terraform plan (plan of record)
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform plan -no-color -input=false -out=tfplan

      # The enforcing copy of the guard. Runs from main, so a pull request
      # cannot have edited it.
      - name: plan guard
        run: bash ../scripts/plan-guard.sh tfplan

      - name: terraform apply
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform apply -no-color -input=false tfplan

      - name: Show resulting access matrix
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform output -json app_access_matrix
