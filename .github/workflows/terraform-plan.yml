name: terraform-plan

# No `paths:` filter, deliberately. `plan` is a required status check, and a
# required check that never reports leaves the pull request stuck on
# "Expected" forever. A filtered workflow does not report at all, so a
# docs-only or bootstrap-only change could never be merged.
on:
  pull_request:

# Least privilege: read the code, write a PR comment, mint an OIDC token.
# No AWS keys are stored anywhere in GitHub.
permissions:
  contents: read
  pull-requests: write
  id-token: write

# A new push supersedes the previous plan. Cancelling also withdraws a run
# still waiting for environment approval, so reviewers only approve the
# latest commit.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: eu-central-1

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    # No job-level `if:` for forks. GitHub counts a SKIPPED required check as
    # passing, so skipping here would let a fork pull request satisfy `plan`
    # without a plan ever running. The fork case is failed explicitly below
    # instead.

    # THIS JOB RUNS UNTRUSTED CODE. For pull_request events GitHub executes
    # the workflow definition from the PR head, so anyone who can push a
    # branch can rewrite the steps below. Two controls contain that:
    #
    #   1. TF_GITHUB_TOKEN lives in this environment, not in repository
    #      secrets, and the environment has required reviewers. A human
    #      releases the credential per run, after looking at the diff.
    #   2. AWS_PLAN_ROLE_ARN grants s3:GetObject only. Even with the
    #      credential, this job cannot write or delete state.
    environment: plan

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Reject fork pull requests
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork pull requests cannot run terraform plan — forks receive no secrets."
          echo "Re-open this change as a branch on the repository itself."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC, read-only state)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Whole repository, so bootstrap/ is held to the same standard.
      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff ..
        continue-on-error: true

      - name: terraform init
        run: terraform init -input=false

      # bootstrap/ is applied by hand (see README), so CI cannot plan it — but
      # it can still catch a change that would not even validate.
      - name: terraform validate
        id: validate
        continue-on-error: true
        run: |
          terraform validate -no-color
          terraform -chdir=../bootstrap init -backend=false -input=false >/dev/null
          terraform -chdir=../bootstrap validate -no-color

      - name: terraform plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        # -lock=false: a plan needs no lock, and taking one would block a
        # concurrent apply for no benefit.
        if: steps.validate.outcome == 'success'
        run: |
          set +e
          terraform plan -no-color -input=false -lock=false -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          # Governance checks are warnings and do not move the exit code, so
          # list them explicitly for the reviewer instead of leaving them
          # buried in the plan output.
          : > failed_checks.txt
          if [ -f tfplan ]; then
            terraform show -json tfplan \
              | jq -r '.checks[]? | select(.status == "fail") | .address.to_display' \
              > failed_checks.txt
          fi

      # Advisory here: this job runs pull request code, which could edit the
      # script. The enforcing copy runs in terraform-apply.yml, from main.
      - name: plan guard
        id: guard
        if: steps.plan.outputs.exitcode == '0'
        continue-on-error: true
        run: bash ../scripts/plan-guard.sh tfplan 2>&1 | tee guard.txt; exit "${PIPESTATUS[0]}"

      - name: Comment plan on PR
        if: always() && steps.fmt.outcome != 'skipped'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FMT: ${{ steps.fmt.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
          GUARD: ${{ steps.guard.outcome }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '';
            let plan = read('terraform/plan.txt') || 'Plan did not run — see fmt/validate above and the workflow log.';
            const failedChecks = read('terraform/failed_checks.txt').trim().split('\n').filter(Boolean);
            const planResult = { '0': 'success', '': 'skipped' }[process.env.PLAN_EXIT ?? ''] ?? 'failure';
            const guardErrors = read('terraform/guard.txt').split('\n')
              .filter(l => l.startsWith('::error'))
              .map(l => '> ' + l.replace(/^::error[^:]*::/, ''));

            // GitHub rejects comments over 65536 chars.
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(0, LIMIT) + '\n\n...truncated, see the workflow log.';
            }

            const body = [
              '### Terraform plan',
              '',
              `| check | result |`,
              `| --- | --- |`,
              `| fmt | ${process.env.FMT} |`,
              `| validate | ${process.env.VALIDATE} |`,
              `| plan | ${planResult} |`,
              `| destroy guard | ${process.env.GUARD || 'skipped'} |`,
              `| governance checks | ${failedChecks.length ? '⚠️ ' + failedChecks.join(', ') : 'all pass'} |`,
              '',
              ...(guardErrors.length ? ['**Destroy guard refused this plan:**', '', ...guardErrors, ''] : []),
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              '_Governance checks warn without failing this job — an orphan elsewhere in the org should not block your change. Messages are in the plan output. See docs/OPERATIONS.md._',
            ].join('\n');

            const marker = '### Terraform plan';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if fmt, validate, plan or guard failed
        if: >-
          steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' ||
          steps.plan.outputs.exitcode != '0' || steps.guard.outcome == 'failure'
        env:
          RESULT: fmt=${{ steps.fmt.outcome }} validate=${{ steps.validate.outcome }} plan_exit=${{ steps.plan.outputs.exitcode }} guard=${{ steps.guard.outcome }}
        run: |
          echo "$RESULT"
          exit 1
