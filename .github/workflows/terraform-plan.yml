name: terraform-plan

# Plans every pull request automatically — no approval, and no pull request
# code ever runs.
#
# pull_request_target runs THIS FILE AS IT IS ON MAIN, in a checkout of main.
# The only thing taken from the pull request is its catalogue data (the
# *.auto.tfvars files), fetched as plain file contents by
# scripts/take-pr-catalogue.sh. Variable files cannot execute anything, and
# everything that interprets them — the Terraform code, the scripts, this
# workflow — comes from main. That is what makes it safe to give this job the
# organisation-admin credential with nobody approving the run.
#
# A pull request that changes code is planned here with MAIN's code, which is
# not what it will do once merged; the comment says so, and
# terraform-plan-code.yml plans its own code, automatically, with a read-only
# token.
#
# Never add a step that checks out, installs, builds or runs anything from the
# pull request. That turns this workflow into a textbook "pwn request".

on:
  pull_request_target:

# Nothing at workflow level: each job requests exactly what it needs.
permissions: {}

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # the plan comment
      statuses: write # the terraform-plan status on the pull request's head
      id-token: write # OIDC to the read-only state role

    # Main only, no reviewer (bootstrap/github.tf). The credential is
    # reachable here because this definition can only come from main.
    environment: plan

    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # The required check is a commit status on the PR head, not this job's
      # check run: pull_request_target runs against the base commit, and its
      # check run is not guaranteed to attach to the head.
      - name: Mark terraform-plan pending
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent
          -f state=pending -f context=terraform-plan
          -f description="Planning this pull request's catalogue"
          -f target_url="$RUN_URL"

      # This job holds the org-admin credential. A fork's data is still only
      # data, but there is no reason to spend that credential on strangers.
      - name: Reject fork pull requests
        if: env.HEAD_REPO != github.repository
        run: |
          echo "::error::Fork pull requests are not planned. Push the branch to this repository instead."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the pull request's catalogue data (and nothing else)
        run: bash scripts/take-pr-catalogue.sh "$GITHUB_REPOSITORY" "$PR_NUMBER" "$HEAD_SHA"

      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC, read-only state)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform
        run: terraform init -input=false -no-color

      - name: terraform plan
        id: report
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          if [ -s ../code_changes.txt ]; then
            # shellcheck disable=SC2016 # the backticks are Markdown, not shell
            files=$(sed 's/.*/`&`/' ../code_changes.txt | paste -sd, - | sed 's/,/, /g')
            export REPORT_NOTE="⚠️ **This pull request also changes code:** $files. The plan above runs **main's** code against this pull request's catalogue, so it does not show what the code change will do. \`terraform-plan-code\` posts a second comment with the pull request's own code planned."
          fi
          bash ../scripts/plan-report.sh "### Terraform plan — catalogue" report.md

      - name: Comment the plan on the pull request
        if: ${{ !cancelled() && hashFiles('terraform/report.md') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT: terraform/report.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT, 'utf8');
            const marker = body.split('\n')[0];
            const issue_number = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Report terraform-plan result
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.report.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            state=success; description="Plan and destroy guard passed"
          else
            state=failure; description="Plan, guard or setup failed — see the comment or the log"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --silent \
            -f state="$state" -f context=terraform-plan \
            -f description="$description" -f target_url="$RUN_URL"
