name: terraform-plan

# No `paths:` filter, deliberately. `plan` is a required status check, and a
# required check that never reports leaves the pull request stuck on
# "Expected" forever. A filtered workflow does not report at all, so a
# docs-only or bootstrap-only change could never be merged.
on:
  pull_request:

# Least privilege: read the code, write a PR comment, mint an OIDC token.
# No AWS keys are stored anywhere in GitHub.
permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: eu-central-1

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    # No job-level `if:` for forks. GitHub counts a SKIPPED required check as
    # passing, so skipping here would let a fork pull request satisfy `plan`
    # without a plan ever running. The fork case is failed explicitly below
    # instead.

    # THIS JOB RUNS UNTRUSTED CODE. For pull_request events GitHub executes
    # the workflow definition from the PR head, so anyone who can push a
    # branch can rewrite the steps below. Two controls contain that:
    #
    #   1. TF_GITHUB_TOKEN lives in this environment, not in repository
    #      secrets, and the environment has required reviewers. A human
    #      releases the credential per run, after looking at the diff.
    #   2. AWS_PLAN_ROLE_ARN grants s3:GetObject only. Even with the
    #      credential, this job cannot write or delete state.
    environment: plan

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Reject fork pull requests
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork pull requests cannot run terraform plan — forks receive no secrets."
          echo "Re-open this change as a branch on the repository itself."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC, read-only state)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        id: validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        # -lock=false: a plan needs no lock, and taking one would block a
        # concurrent apply for no benefit.
        run: |
          set +e
          terraform plan -no-color -input=false -lock=false -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FMT: ${{ steps.fmt.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');

            // GitHub rejects comments over 65536 chars.
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(0, LIMIT) + '\n\n...truncated, see the workflow log.';
            }

            const body = [
              '### Terraform plan',
              '',
              `| check | result |`,
              `| --- | --- |`,
              `| fmt | ${process.env.FMT} |`,
              `| validate | ${process.env.VALIDATE} |`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              '_Governance check failures appear in the plan output above._',
            ].join('\n');

            const marker = '### Terraform plan';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if fmt, validate or plan failed
        if: steps.fmt.outcome == 'failure' || steps.plan.outputs.exitcode != '0'
        run: |
          echo "fmt=${{ steps.fmt.outcome }} plan_exit=${{ steps.plan.outputs.exitcode }}"
          exit 1
