name: terraform-plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

# Least privilege: read the code, write a PR comment, mint an OIDC token.
# No AWS keys are stored anywhere in GitHub.
permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: eu-central-1

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    # Fork PRs receive no secrets, so the job would fail confusingly rather
    # than being skipped on purpose. Skip it on purpose.
    if: github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        id: validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        # -lock=false: a plan needs no lock, and taking one would block a
        # concurrent apply for no benefit.
        run: |
          set +e
          terraform plan -no-color -input=false -lock=false -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          FMT: ${{ steps.fmt.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');

            // GitHub rejects comments over 65536 chars.
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(0, LIMIT) + '\n\n...truncated, see the workflow log.';
            }

            const body = [
              '### Terraform plan',
              '',
              `| check | result |`,
              `| --- | --- |`,
              `| fmt | ${process.env.FMT} |`,
              `| validate | ${process.env.VALIDATE} |`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              '_Governance check failures appear in the plan output above._',
            ].join('\n');

            const marker = '### Terraform plan';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if fmt, validate or plan failed
        if: steps.fmt.outcome == 'failure' || steps.plan.outputs.exitcode != '0'
        run: |
          echo "fmt=${{ steps.fmt.outcome }} plan_exit=${{ steps.plan.outputs.exitcode }}"
          exit 1
